[plugins/color]
night-light-enabled=true
night-light-schedule-automatic=false
night-light-schedule-from=6.0
night-light-temperature=uint32 3700

[plugins/housekeeping]
donation-reminder-last-shown=int64 1765879708195165

[plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/']
screensaver=['<Super>Escape']
search=['<Alt>space']

[plugins/media-keys/custom-keybindings/custom0]
binding='<Super>w'
command='fish $HOME/.config/scripts/restart-wifi.fish'
name='Restart wifi'

[plugins/media-keys/custom-keybindings/custom1]
binding='<Shift><Super>Escape'
command='dbus-send --system --print-reply \\\n  --dest="org.freedesktop.login1" \\\n  /org/freedesktop/login1 \\\n  org.freedesktop.login1.Manager.Suspend boolean:true'
name='Suspend'

[plugins/media-keys/custom-keybindings/custom2]
binding='<Super>Return'
command='kitty tmux new -As def'
name='Terminal'

[plugins/media-keys/custom-keybindings/custom3]
binding='<Super>b'
command='fish $HOME/.config/scripts/toggle-bluetooth.fish'
name='Toggle bluetooth Woofers'

[plugins/power]
sleep-inactive-ac-timeout=7200
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=1800
sleep-inactive-battery-type='nothing'
