[a11y/applications]
screen-reader-enabled=false

[a11y/magnifier]
mag-factor=2.0

[app-folders]
folder-children=['Utilities', 'YaST']

[app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[app-folders/folders/Utilities]
apps=['gnome-abrt.desktop', 'gnome-system-log.desktop', 'gnome-system-monitor.desktop', 'gucharmap.desktop', 'nm-connection-editor.desktop', 'org.gnome.baobab.desktop', 'org.gnome.Calculator.desktop', 'org.gnome.DejaDup.desktop', 'org.gnome.Dictionary.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.eog.desktop', 'org.gnome.Evince.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.fonts.desktop', 'org.gnome.Screenshot.desktop', 'org.gnome.seahorse.Application.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.tweaks.desktop', 'org.gnome.Usage.desktop', 'simple-scan.desktop', 'vinagre.desktop', 'yelp.desktop']
categories=['X-GNOME-Utilities']
name='X-GNOME-Utilities.directory'
translate=true

[app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/jonny/.local/share/backgrounds/2026-04-10-20-24-19-arch-linux-1920-x-1080-wallpaper-xw0szpochzcu0gml.webp'
picture-uri-dark='file:///home/jonny/.local/share/backgrounds/2026-04-10-20-24-19-arch-linux-1920-x-1080-wallpaper-xw0szpochzcu0gml.webp'
primary-color='#000000000000'
secondary-color='#000000000000'

[calendar]
show-weekdate=false

[datetime]
automatic-timezone=false

[input-sources]
mru-sources=[('xkb', 'it'), ('ibus', 'anthy'), ('xkb', 'us')]
per-window=false
show-all-sources=true
sources=[('xkb', 'it'), ('xkb', 'us'), ('ibus', 'anthy')]
xkb-options=['caps:swapescape']

[interface]
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='default'
enable-animations=true
enable-hot-corners=false
font-antialiasing='grayscale'
font-hinting='slight'
font-name='Noto Sans,  10'
gtk-theme='Adwaita-dark'
icon-theme='Adwaita'
show-battery-percentage=true
toolbar-style='text'
toolkit-accessibility=false

[notifications]
application-children=['com-uploadedlobster-peek', 'discord', 'firefox', 'gnome-power-panel', 'gnome-control-center', 'libreoffice-writer', 'postman', 'gimp', 'gnome-network-panel', 'org-gnome-nautilus', 'skypeforlinux', 'thunderbird', 'kitty', 'teams', 'alacritty', 'libreoffice-calc', 'telegramdesktop', 'gnome-system-monitor', 'visual-studio-code', 'org-gnome-epiphany', 'smplayer', 'steam', 'org-gnome-extensions-desktop', 'org-gnome-chromegnomeshell', 'org-gnome-shell-extensions', 'google-chrome', 'pgadmin4', 'org-gnome-settings', 'org-gnome-clocks', 'org-gnome-shell-portalhelper', 'torbrowser', 'code-oss', 'kakaotalk', 'io-dbeaver-dbeaver', 'org-gnome-characters', 'zoom', 'insomnia', 'org-gnome-extensions', 'io-github-slgobinath-safeeyes', 'zen', 'vlc']
show-banners=true

[peripherals/keyboard]
numlock-state=false

[peripherals/mouse]
natural-scroll=false

[peripherals/touchpad]
edge-scrolling-enabled=false
natural-scroll=true
send-events='enabled'
speed=0.20588235294117641
tap-to-click=true
two-finger-scrolling-enabled=true

[privacy]
disable-microphone=false
remove-old-trash-files=true

[screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/jonny/.local/share/backgrounds/2026-04-10-20-24-19-arch-linux-1920-x-1080-wallpaper-xw0szpochzcu0gml.webp'
primary-color='#000000000000'
secondary-color='#000000000000'

[session]
idle-delay=uint32 0

[wm/keybindings]
activate-window-menu=@as []
maximize=['<Super>k']
minimize=@as []
move-to-monitor-down=['<Shift><Super>j']
move-to-monitor-left=['<Shift><Super>h']
move-to-monitor-right=['<Shift><Super>l']
move-to-monitor-up=['<Shift><Super>k']
move-to-workspace-1=['<Shift><Super>u']
move-to-workspace-2=['<Shift><Super>i']
move-to-workspace-3=['<Shift><Super>o']
move-to-workspace-4=['<Shift><Super>equal']
move-to-workspace-down=@as []
move-to-workspace-last=@as []
move-to-workspace-left=['<Shift><Super>n']
move-to-workspace-right=['<Shift><Super>m']
move-to-workspace-up=@as []
switch-to-workspace-1=['<Super>u']
switch-to-workspace-2=['<Super>i']
switch-to-workspace-3=['<Super>o']
switch-to-workspace-4=['<Super>0']
switch-to-workspace-down=@as []
switch-to-workspace-last=@as []
switch-to-workspace-left=['<Super>n']
switch-to-workspace-right=['<Super>m']
switch-to-workspace-up=@as []
unmaximize=['<Super>j']

[wm/preferences]
button-layout='icon:minimize,maximize,close'
